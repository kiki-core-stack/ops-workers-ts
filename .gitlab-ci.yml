# CI includes
#
# Use local or project-level includes when this pipeline is composed from
# additional configuration files.
#
# include:
#   - local: .gitlab/ci/*.yml
#   - project: group/project
#     file: path/to/template.yml
#     ref: main

# Stages
#
# Declare the stages used by this pipeline and keep their order aligned with
# the execution flow.

stages:
  - check
  # - release

# Defaults

# Default settings apply to every non-hidden job unless a job overrides them.
default:
  interruptible: true

  # retry:
  #   max: 1
  #   when:
  #     - runner_system_failure
  #     - stuck_or_timeout_failure
  # timeout: 30m

# Variables

variables:
  # Git checkout behavior.
  # Keep check jobs shallow; release jobs can override this value when complete
  # tag and commit history are required.
  GIT_DEPTH: '20'
  GIT_SUBMODULE_STRATEGY: none

  # GitLab cache archive tuning.
  # These settings reduce compression overhead for dependency caches.
  CACHE_COMPRESSION_FORMAT: tarzstd
  CACHE_COMPRESSION_LEVEL: fastest

  # Project-local cache paths. GitLab cache paths must stay inside the checkout.
  BUN_CACHE_DIR: .cache/bun/install/cache
  NPM_CONFIG_CACHE: .cache/npm

  # pnpm standalone installation writes its executable to PNPM_HOME. Keep that
  # directory outside the cached store so binaries are recreated per job.
  PNPM_HOME: $CI_PROJECT_DIR/.pnpm
  PNPM_STORE_DIR: .cache/pnpm/store

  # npm / semantic-release install hardening.
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  NPM_CONFIG_MIN_RELEASE_AGE: '1'

# Rules

# Main-branch rule for release and deployment jobs.
.main-branch-rules: &main-branch-rules
  - if: '$CI_COMMIT_BRANCH == "main"'
    when: on_success
  - when: never

# Merge-request rule for checks targeting dev or main.
.check-rules: &check-rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(dev|main)$/'
    when: always
  - when: never

# Caches

# Keep each lockfile in its cache key so dependency changes invalidate only the
# relevant package-manager cache.
.bun-cache: &bun-cache
  key:
    files:
      - bun.lock
      - bun.lockb

  paths:
    - .cache/bun/install/cache

  policy: pull-push

.npm-cache: &npm-cache
  key: npm-cache

  paths:
    - .cache/npm

  policy: pull-push

.pnpm-cache: &pnpm-cache
  key:
    files:
      - pnpm-lock.yaml

  paths:
    - .cache/pnpm/store

  policy: pull-push

# Scripts

# Install the tools shared by both package-manager modes.
.install-packages: &install-packages
  - apk add --no-cache curl git

# Optional SSH setup.
#
# This reusable command group is inert until referenced by a package-manager
# setup. `SSH_HOST` and `CI_SSH_PRIVATE_KEY_FOR_PACK` must be provided as CI/CD
# variables when the group is used.
.setup-ssh-and-scan: &setup-ssh-and-scan
  - apk add --no-cache openssh-client
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - cp "${CI_SSH_PRIVATE_KEY_FOR_PACK:?must be set}" ~/.ssh/id_ed25519
  - chmod 600 ~/.ssh/id_ed25519
  - ssh-keyscan -H "${SSH_HOST:?must be set}" >> ~/.ssh/known_hosts
  - chmod 644 ~/.ssh/known_hosts

# Bun install setup.
#
# Install dependencies with Bun and a frozen lockfile. The explicit cache path
# avoids writing a repository bunfig.toml.
.setup-bun-and-install-dependencies: &setup-bun-and-install-dependencies
  - *install-packages
  # - *setup-ssh-and-scan
  - bun install --cache-dir "${BUN_CACHE_DIR:?must be set}" --frozen-lockfile

# pnpm install setup.
#
# Install pnpm with the standalone installer and use a frozen lockfile.
# `PNPM_VERSION=latest` intentionally follows the latest pnpm release line.
.setup-pnpm-and-install-dependencies: &setup-pnpm-and-install-dependencies
  - *install-packages
  # - *setup-ssh-and-scan
  - export PATH="${PNPM_HOME:?must be set}/bin:$PATH"
  - curl -fsSL https://get.pnpm.io/install.sh | env PNPM_VERSION=latest sh -
  - pnpm config set store-dir "${PNPM_STORE_DIR:?must be set}"
  - pnpm install --frozen-lockfile

# Job templates for each package-manager mode.

.check-job:
  stage: check

  rules: *check-rules

# Bun job template.
#
# Select this template when the project uses Bun and bun.lock.
.bun-check-job:
  extends: .check-job
  image: oven/bun:alpine

  cache: *bun-cache

  before_script: *setup-bun-and-install-dependencies

# pnpm job template.
#
# Select this template when the project uses pnpm and pnpm-lock.yaml.
# .pnpm-check-job:
#   extends: .check-job
#   image: node:26-alpine
#
#   cache: *pnpm-cache
#
#   before_script: *setup-pnpm-and-install-dependencies

# Check jobs: Bun.
#
# Keep one package-manager variant of each check job enabled.

lint:
  extends: .bun-check-job

  script:
    - bun run lint

typecheck:
  extends: .bun-check-job

  script:
    - bun run typecheck

build:
  extends: .bun-check-job

  script:
    - bun run build

# Check jobs: pnpm.
#
# Keep one package-manager variant of each check job enabled.
#
# lint:
#   extends: .pnpm-check-job
#
#   script:
#     - pnpm run lint
#
# typecheck:
#   extends: .pnpm-check-job
#
#   script:
#     - pnpm run typecheck
#
# build:
#   extends: .pnpm-check-job
#
#   script:
#     - pnpm run build

# Release job.
#
# Use this job when the repository has semantic-release configuration and the
# required GitLab release variables. The job follows the main-branch rules.
#
# Keep the semantic-release package ranges synchronized and update them as one
# tested set.
# release:
#   stage: release
#   image: node:26-alpine
#
#   rules: *main-branch-rules
#
#   variables:
#     GIT_DEPTH: '0'
#
#   cache: *npm-cache
#
#   before_script:
#     - apk add --no-cache git
#     - |
#       npm install --global \
#         --ignore-scripts=true \
#         --min-release-age=1 \
#         semantic-release@^25 \
#         @semantic-release/changelog@^6 \
#         @semantic-release/git@^10 \
#         @semantic-release/gitlab@^13 \
#         conventional-changelog-conventionalcommits@^9
#
#   script:
#     - semantic-release
